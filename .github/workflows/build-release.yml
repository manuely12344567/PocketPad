name: Compiler PocketPad (Android APK + Windows EXE)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: '1.2.0'

jobs:
  build-android:
    name: Android (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Générer une clé de signature Release APK
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pocketpad-release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias pocketpad \
            -storepass pocketpad123 \
            -keypass pocketpad123 \
            -dname "CN=PocketPad, OU=Gaming, O=PocketPad, L=Lome, C=TG"

      - name: Tests unitaires Kotlin & Compilation APK Release
        working-directory: android
        env:
          POCKETPAD_KEYSTORE_PATH: ${{ runner.temp }}/pocketpad-release.jks
          POCKETPAD_KEYSTORE_PASSWORD: pocketpad123
          POCKETPAD_KEY_ALIAS: pocketpad
          POCKETPAD_KEY_PASSWORD: pocketpad123
        run: |
          gradle testDebugUnitTest --no-daemon
          gradle assembleRelease --no-daemon
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/app-release.apk "../dist-android/PocketPad-Android-${APP_VERSION}.apk"
          ls -lh ../dist-android/

      - name: Archiver l’APK Android
        uses: actions/upload-artifact@v4
        with:
          name: PocketPad-Android-APK
          path: dist-android/*.apk

  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Embarquer Google ADB (Platform-Tools) pour le câble USB auto
        shell: pwsh
        run: |
          $zipPath = "$env:RUNNER_TEMP\platform-tools.zip"
          $extractDir = "$env:RUNNER_TEMP\platform-tools-extract"
          $targetDir = "windows\PocketPad.Windows\Tools\adb"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item "$extractDir\platform-tools\adb.exe" $targetDir
          Copy-Item "$extractDir\platform-tools\AdbWinApi.dll" $targetDir
          Copy-Item "$extractDir\platform-tools\AdbWinUsbApi.dll" $targetDir
          Get-ChildItem $targetDir

      - name: Tests unitaires C# (PocketPad.Tests)
        run: dotnet test windows/PocketPad.Tests/PocketPad.Tests.csproj -c Release

      - name: Compiler PocketPad Portable (.exe autonome avec ADB intégré)
        run: |
          dotnet publish windows/PocketPad.Windows/PocketPad.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o windows/publish-win-x64
        shell: pwsh

      - name: Préparer Portable & Compiler l’Installateur Setup (.exe via Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows\release | Out-Null
          Copy-Item "windows\publish-win-x64\PocketPad.exe" "windows\release\PocketPad-Portable-${env:APP_VERSION}.exe"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer\PocketPad.iss"
          Get-ChildItem windows\release\*.exe

      - name: Archiver les exécutables Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: PocketPad-Windows-EXE
          path: windows/release/*.exe

  publish-release:
    name: Publier la Release GitHub
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger l’APK Android
        uses: actions/download-artifact@v4
        with:
          name: PocketPad-Android-APK
          path: release-assets

      - name: Télécharger les exécutables Windows
        uses: actions/download-artifact@v4
        with:
          name: PocketPad-Windows-EXE
          path: release-assets

      - name: Vérifier les fichiers finaux
        run: ls -lh release-assets/

      - name: Publier la Release GitHub (Android APK + Windows Setup & Portable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: PocketPad v${{ env.APP_VERSION }} — Mode Écran Switch & Split-Screen 4J · Android (.apk) & Windows (.exe)
          body: |
            ## Téléchargements 1 clic — PocketPad v${{ env.APP_VERSION }} (Mode « Nintendo Switch » & Split-Screen 4J !)

            Les spectateurs profitent du jeu complet sur l’écran du PC pendant que **chaque joueur joue sur son propre écran en direct sur son téléphone**, sous ses touches tactiles transparentes et personnalisables !

            ### Fichiers inclus
            - **Android :** `PocketPad-Android-${{ env.APP_VERSION }}.apk` — installe-le sur 1 à 4 téléphones Android (Android 8.0+).
            - **Windows (Installateur 1 clic) :** `PocketPad-Setup-${{ env.APP_VERSION }}.exe` — Bureau + Menu Démarrer + pont USB ADB embarqué.
            - **Windows (Portable 1 clic) :** `PocketPad-Portable-${{ env.APP_VERSION }}.exe` — autonome sans installation + pont USB ADB embarqué.

            ### Nouveautés v${{ env.APP_VERSION }} — Mode Écran Switch & Split-Screen
            - **Diffusion d’écran temps réel par joueur (DXGI GPU + repli GDI)** : canal vidéo TCP dédié (`27185`) séparé des entrées manette (`27183`) pour que tes boutons restent toujours `< 2 ms`, avec double tunnel USB ADB automatique et mode hybride Bluetooth + Wi-Fi.
            - **Subdivision Split-Screen complète (onglet *Mode Écran Switch & Split-Screen*)** :
              - Presets 1-clic : **Plein écran partagé**, **2J Haut/Bas**, **2J Gauche/Droite**, **3J (1+2)**, **4J Grille 2×2**, et **Zones personnalisées**.
              - **Aperçu interactif en direct sur PC** : glisse et redimensionne à la souris les cadres colorés `J1` (Cyan), `J2` (Violet), `J3` (Vert), `J4` (Orange) sur le jeu.
              - **Vue Menu (1 clic) + Auto-détection Menu ↔ Match** : affiche automatiquement tout l’écran dans les menus puis zoome sur la zone de chaque joueur dès que le split-screen démarre !
              - **Rotation rapide des vues** (`Pivoter vues ↻`) + sélection multi-écrans PC + 4 profils de qualité/FPS.
            - **Expérience Nintendo Switch sur Android** :
              - **Bouton rapide `Écran: ON / OFF`** dans la barre supérieure en jeu.
              - **Réglages `Opacité` en direct** : transparence des boutons (`15 %` → `100 %`), mode Ajuster / Remplir tout l’écran, et qualité vidéo.
              - **Éditeur visuel sur fond de jeu** : place tes boutons autour du HUD réel du jeu !
          files: |
            release-assets/*
          draft: false
          prerelease: false
          make_latest: true
